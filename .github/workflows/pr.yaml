name: PR Validation

on:
  pull_request:
    branches:
      - main
      - 'release/*'
    types: [opened, synchronize, reopened]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    name: Lint project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # This ensures we get the full git history for changesets
          fetch-depth: 0

      - name: Setup pnpm and node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Check formatting
        run: pnpm format:check

      - name: Check linting
        run: pnpm lint
